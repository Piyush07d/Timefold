<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Map</title>
    <style>
        .map-container {
            position: relative;
            width: 100%;
            max-width: 1408px;
            margin: auto;
        }

        .map-window {
            width: 100%;
            height: 600px;
            overflow: hidden;
            position: relative;
            background: #eee;
        }

        #mapMove {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            transform-origin: 0 0;
            transition: transform 1s cubic-bezier(.22, 1, .36, 1);
        }

        .campus-map {
            width: 100%;
            display: block;
        }

        .map-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .controls button {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        .controls button:hover {
            background: #f0f7ff;
            border-color: #009dff;
        }

        .controls button.active-btn {
            background: #009dff;
            color: #fff;
            border-color: #009dff;
        }

        .reset-btn {
            margin-left: auto;
        }
    </style>
</head>

<body>
    <div class="map-container">
        <div class="map-window">
            <div id="mapMove">
                <img src="image/map.png" class="campus-map" alt="Campus map">
                <object id="mapLayer" class="map-layer" data="image/campus_map_layer.svg" type="image/svg+xml"></object>
            </div>
        </div>

        <div class="controls">
            <button data-building="4001" onclick="moveToBuilding(4001)">4001</button>
            <button data-building="4002" onclick="moveToBuilding(4002)">4002</button>
            <button data-building="4003" onclick="moveToBuilding(4003)">4003</button>
            <button data-building="4004" onclick="moveToBuilding(4004)">4004</button>
            <button data-building="4005" onclick="moveToBuilding(4005)">4005</button>
            <button data-building="4006" onclick="moveToBuilding(4006)">4006</button>
            <button data-building="4007" onclick="moveToBuilding(4007)">4007</button>
            <button data-building="4008" onclick="moveToBuilding(4008)">4008</button>
            <button data-building="4009" onclick="moveToBuilding(4009)">4009</button>
            <button class="reset-btn" onclick="resetView()">Reset</button>
        </div>
    </div>

    <script>
        // Original image size the SVG polygons were drawn against.
        const ORIGINAL_WIDTH = 1408;
        const ORIGINAL_HEIGHT = 1117;
        const ZOOM_SCALE = 1.1;

        // Centroid (average of the polygon points) for every building,
        // in the SVG's own 1408x1117 coordinate space.
        const buildingCentroids = {
            4001: { x: 930.5,  y: 208.0 },
            4002: { x: 673.75, y: 316.9 },
            4003: { x: 449.4,  y: 488.75 },
            4004: { x: 335.0,  y: 573.75 },
            4005: { x: 914.4,  y: 568.9 },
            4006: { x: 453.9,  y: 875.6 },
            4007: { x: 808.9,  y: 874.9 },
            4008: { x: 1142.1, y: 849.3 },
            4009: { x: 1079.2, y: 386.7 }
        };

        const mapMove = document.getElementById('mapMove');
        const mapWindow = document.querySelector('.map-window');
        const svgObject = document.getElementById('mapLayer');

        let svgDoc = null;

        // Wire up clicks on the SVG polygons themselves once the
        // embedded SVG has finished loading.
        svgObject.addEventListener('load', () => {
            svgDoc = svgObject.contentDocument;
            if (!svgDoc) return;

            svgDoc.querySelectorAll('.building-hitbox').forEach(el => {
                el.addEventListener('click', () => {
                    const id = parseInt(el.id.replace('building', ''), 10);
                    moveToBuilding(id);
                });
            });
        });

        function moveToBuilding(id) {
            const centroid = buildingCentroids[id];
            if (!centroid) return;

            const rect = mapWindow.getBoundingClientRect();
            const ratio = rect.width / ORIGINAL_WIDTH;

            // Where the building's centroid currently sits, in on-screen px,
            // before any transform is applied.
            const px = centroid.x * ratio;
            const py = centroid.y * ratio;

            // Translate so that point lands in the center of the visible
            // window, then scale up around that same top-left origin.
            const targetX = rect.width / 2 - px * ZOOM_SCALE;
            const targetY = rect.height / 2 - py * ZOOM_SCALE;

            mapMove.style.transform =
                `translate(${targetX}px, ${targetY}px) scale(${ZOOM_SCALE})`;

            highlightBuilding(id);
            setActiveButton(id);
        }

        function highlightBuilding(id) {
            if (!svgDoc) return;
            svgDoc.querySelectorAll('.building-hitbox').forEach(el => {
                el.classList.remove('active');
            });
            const target = svgDoc.getElementById('building' + id);
            if (target) target.classList.add('active');
        }

        function setActiveButton(id) {
            document.querySelectorAll('.controls button[data-building]').forEach(btn => {
                btn.classList.toggle('active-btn', btn.dataset.building == id);
            });
        }

        function resetView() {
            mapMove.style.transform = 'translate(0px, 0px) scale(1)';
            if (svgDoc) {
                svgDoc.querySelectorAll('.building-hitbox').forEach(el => {
                    el.classList.remove('active');
                });
            }
            document.querySelectorAll('.controls button[data-building]').forEach(btn => {
                btn.classList.remove('active-btn');
            });
        }
    </script>
</body>

</html>
