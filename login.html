<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeFold</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Noto+Sans+Balinese:wght@400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Varela+Round&display=swap"
        rel="stylesheet">
    <style>
        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);

            font-family: Arial, sans-serif;
        }


        .login {
            width: 350px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;

            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);

            text-align: center;
        }


        .login.h1 {
            color: white;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }



        .login input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 18px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }
    </style>
</head>

<body>
    <div class="login">
        <h1>Login</h1>
        <input id="enroll" placeholder="Enrollment Number">
        <input id="password" type="password" placeholder="Password">
        <input id="confirm-password" type="text" placeholder="batch">


        <button onclick="login()">Login</button>
        <a href="register.html">For New Registration Click here</a>

    </div>
</body>
<script>
    async function login() {


        const enroll = await document.getElementById('enroll').value;
        const password = await document.getElementById('password').value;
        const batch = await document.getElementById('confirm-password').value;
        if (!enroll || !password || !batch) {
            alert('Please enter all fields.');
            return;
        }
        const response = await fetch('/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ enroll, password, batch })
        });
       
        const data = await response.json();

        if (response.ok) {
            alert(data.message);
            window.location.href = "/home.html";
        } else {
            alert(data.message);
        }
    }
</script>
</html>
